name: Export Unity licence
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          printf '%s' "${{ secrets.UNITY_LICENSE }}" > out/Unity_lic.ulf
          wc -c out/Unity_lic.ulf
      - uses: actions/upload-artifact@v4
        with:
          name: unity-license
          path: out/Unity_lic.ulf
